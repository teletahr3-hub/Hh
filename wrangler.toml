name = "anonymous-contact-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

# ---------------------------------------------------------------------------
# قاعدة بيانات D1
# انشئها بالامر:   npx wrangler d1 create contact-bot-db
# ثم الصق database_id الذي يظهر لك مكان القيمة ادناه.
# الجداول تُنشأ تلقائيا عند اول تشغيل، لا حاجة لملف SQL.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "contact-bot-db"
database_id = "ضع-database_id-هنا"

# ---------------------------------------------------------------------------
# مهمة مجدولة كل دقيقة: تكمل الاذاعة الكبيرة وتنظف البيانات القديمة
# ---------------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# المتغيرات العامة
# التوكن لا يوضع هنا ابدا. استخدم:  npx wrangler secret put BOT_TOKEN
# ---------------------------------------------------------------------------
[vars]
OWNER_ID = "6027967703"   # ايدي حسابك الرقمي (يمكنك معرفته من بوت @userinfobot)
BROADCAST_BATCH = "35"            # عدد المستلمين في كل دفعة اذاعة

[observability]
enabled = true
